<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahşap Temalı Video Oynatıcı</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at 15% 20%, rgba(139, 90, 43, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(101, 67, 33, 0.22) 0%, transparent 50%),
                linear-gradient(145deg, #2c1a12 0%, #4a2c1f 45%, #3e2723 100%);
            font-family: 'Roboto', sans-serif;
            padding: 24px;
        }

        .player-container {
            width: 100%;
            max-width: 720px;
            background: linear-gradient(165deg, #8d6e63 0%, #6d4c41 55%, #5d4037 100%);
            border-radius: 18px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 -3px 10px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            border: 4px solid #3e2723;
        }

        /* Ahşap damar efekti */
        .player-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                repeating-linear-gradient(
                    92deg,
                    transparent,
                    transparent 3px,
                    rgba(0, 0, 0, 0.035) 3px,
                    rgba(0, 0, 0, 0.035) 6px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 12px,
                    rgba(0, 0, 0, 0.04) 12px,
                    rgba(0, 0, 0, 0.04) 24px
                );
            pointer-events: none;
            z-index: 1;
            border-radius: 14px;
        }

        .wood-frame {
            padding: 20px 20px 16px;
            position: relative;
            z-index: 2;
        }

        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 6px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            color: #f5f0e8;
            font-size: 1.25rem;
            font-weight: 700;
            text-shadow: 1px 2px 3px rgba(0, 0, 0, 0.45);
            letter-spacing: 0.3px;
        }

        .wood-badge {
            background: linear-gradient(145deg, #a1887f, #7d5a4f);
            color: #f5f0e8;
            font-size: 0.72rem;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #4e342e;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
            font-weight: 500;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1a100b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 
                inset 0 0 25px rgba(0, 0, 0, 0.65),
                0 6px 18px rgba(0, 0, 0, 0.4);
            border: 3px solid #2c1a12;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding: 12px 10px;
            background: linear-gradient(180deg, #5d4037 0%, #4a2c1f 100%);
            border-radius: 12px;
            border: 1px solid #2c1a12;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
        }

        .control-btn {
            background: linear-gradient(145deg, #8d6e63, #6d4c41);
            border: 1px solid #3e2723;
            color: #f5f0e8;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 
                0 4px 8px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.15);
            font-size: 1.15rem;
            user-select: none;
        }

        .control-btn:hover {
            background: linear-gradient(145deg, #a1887f, #8d6e63);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .progress-area {
            flex: 1;
            margin: 0 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .progress-track {
            height: 7px;
            background: #2c1a12;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.55);
        }

        .progress-fill {
            height: 100%;
            width: 28%;
            background: linear-gradient(90deg, #d7ccc8, #bcaaa4);
            border-radius: 4px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #f5f0e8;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.45);
            border: 2px solid #8d6e63;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: #d7ccc8;
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.25);
        }

        .footer span {
            font-size: 0.78rem;
            color: #bcaaa4;
            letter-spacing: 0.6px;
        }

        .note {
            margin-top: 18px;
            text-align: center;
            font-size: 0.8rem;
            color: #a1887f;
            max-width: 720px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .player-container {
                max-width: 100%;
            }
            .title {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <div>
        <div class="player-container">
            <div class="wood-frame">
                <div class="title-bar">
                    <div class="title">Ahşap Oynatıcı</div>
                    <div class="wood-badge">YouTube</div>
                </div>

                <div class="video-wrapper">
                    <iframe 
                        src="https://www.youtube.com/embed/V6-4WUQExVQ?rel=0&modestbranding=1&playsinline=1" 
                        title="Genel Tekrar Videoları ile kaç net yaparım? Ramazan Yetgin"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                    </iframe>
                </div>

                <div class="controls-bar">
                    <button class="control-btn" title="Önceki">⏮</button>
                    
                    <div class="progress-area">
                        <div class="progress-track">
                            <div class="progress-fill"></div>
                        </div>
                        <div class="time-info">
                            <span>0:00</span>
                            <span>—:—</span>
                        </div>
                    </div>

                    <button class="control-btn" title="Sonraki">⏭</button>
                </div>

                <div class="footer">
                    <span>✦ Doğal Ahşap Tema ✦</span>
                </div>
            </div>
        </div>

        <p class="note">
            Video oynamıyorsa dosyayı doğrudan açma.<br>
            <strong>Live Server</strong> ile aç veya dosyayı internete yükle.
        </p>
    </div>
</body>
</html>
