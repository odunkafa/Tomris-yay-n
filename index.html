<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Player</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

iframe {
    width: 360px;
    height: 640px;
    border: 0;
}
</style>
</head>
<body>

<iframe
    src="https://www.youtube.com/embed/29qtD2RJHNw"
    title="YouTube"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
</iframe>

</body>
</html>
