<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahşap Video Player</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(55,25,5,.18) 0px,
            rgba(55,25,5,.18) 2px,
            transparent 2px,
            transparent 10px
        ),
        linear-gradient(
            135deg,
            #70401f,
            #ad6c36 25%,
            #81481f 50%,
            #bd7b40 75%,
            #6b3819
        );
    font-family: Arial, sans-serif;
}

.ahsap {
    width: min(100%, 520px);
    padding: 18px;
    border: 5px solid #4a250f;
    border-radius: 24px;
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.08),
            transparent 25%,
            rgba(0,0,0,.15) 50%,
            transparent 75%
        ),
        linear-gradient(
            135deg,
            #75401d,
            #a96330,
            #82461f,
            #b36f37,
            #6b3818
        );
    box-shadow:
        0 18px 40px rgba(0,0,0,.55),
        inset 0 2px 2px rgba(255,255,255,.18),
        inset 0 -5px 10px rgba(0,0,0,.35);
}

.baslik {
    text-align: center;
    color: #f4d5a8;
    font-size: 24px;
    font-weight: bold;
    margin: 2px 0 16px;
    text-shadow: 2px 2px 3px #321507;
}

.cerceve {
    padding: 9px;
    border-radius: 16px;
    background: #2a1509;
    box-shadow:
        inset 0 0 14px #000,
        0 5px 12px rgba(0,0,0,.5);
}

.video {
    width: 100%;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: 9px;
    background: #000;
}

.video iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.alt {
    margin-top: 15px;
    padding: 11px;
    border-radius: 10px;
    text-align: center;
    color: #e8c79b;
    background: rgba(35,16,6,.55);
    font-size: 14px;
}

.alt a {
    color: #ffd28d;
    font-weight: bold;
    text-decoration: none;
}
</style>
</head>
<body>

<div class="ahsap">

    <div class="baslik">🎬 YouTube Video</div>

    <div class="cerceve">
        <div class="video">
            <iframe
                id="oynatici"
                title="YouTube Video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <div class="alt">
        YouTube'da açmak için
        <a id="youtubeLink" target="_blank">buraya dokun</a>
    </div>

</div>

<script>
const parametreler = new URLSearchParams(window.location.search);
const videoId = parametreler.get("video");

if (videoId) {
    document.getElementById("oynatici").src =
        "https://www.youtube.com/embed/" + encodeURIComponent(videoId);

    document.getElementById("youtubeLink").href =
        "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);
} else {
    document.getElementById("oynatici").src =
        "https://www.youtube.com/embed/62LeGmlX4UA";

    document.getElementById("youtubeLink").href =
        "https://www.youtube.com/watch?v=62LeGmlX4UA";
}
</script>

</body>
</html>
